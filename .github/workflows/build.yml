name: Test All Milestones

on:
  push:
    branches:
      - fullsetup-platform-v2

  workflow_dispatch:

jobs:
  test-milestones:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        milestone:
          - book-companions-milestone1
          - book-companions-milestone2
          - book-companions-milestone3
          - book-companions-milestone4
          - book-companions-milestone5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Current Milestone
        run: |
          echo "======================================"
          echo "Testing ${{ matrix.milestone }}"
          echo "======================================"

      - name: Verify publish.py exists
        run: |
          if [ -f "${{ matrix.milestone }}/engine/publish.py" ]; then
            echo "publish.py found"
          else
            echo "ERROR: publish.py NOT found"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml markdown

      - name: Run Publish Script
        working-directory: ${{ matrix.milestone }}
        run: |
          python engine/publish.py
